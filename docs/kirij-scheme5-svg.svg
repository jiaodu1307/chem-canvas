<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Base-induced elimination from a vicinal chloroiodide</title>
  <desc id="figure-desc">Both tetrahedral centers of substrate 5 are unassigned. Aqueous KOH with tetrabutylammonium bromide gives chloroalkenes and iodoalkenes in a 3:2 family ratio. Each product structure shows its assigned alkene geometry. The upper and lower product rows give the combined distilled yield and the NMR E/Z ratio for each family. The alternative amine-base conditions give only the chloroalkenes.</desc>
  <rect width="1320" height="500" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19262c">
    <text x="32" y="43" font-size="27" font-weight="bold">Base-induced elimination from a vicinal chloroiodide</text>
    <line x1="32" y1="63" x2="1288" y2="63" stroke="#b8c5c8" stroke-width="1"/>

    <g id="substrate-5">
      <title>5, 2-chloro-3-iodo-1,1,1,4,4,4-hexafluorobutane</title>
      <g fill="none" stroke="#19262c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="79,246 124,220 170,246 210,223"/>
        <line x1="124" y1="220" x2="124" y2="187"/>
        <line x1="170" y1="246" x2="170" y2="275"/>
      </g>
      <g font-size="23">
        <text x="75" y="254" text-anchor="end">F₃C</text>
        <text x="214" y="228">CF₃</text>
        <text x="124" y="181" text-anchor="middle">Cl</text>
        <text x="170" y="298" text-anchor="middle">I</text>
      </g>
      <text x="144" y="322" text-anchor="middle" font-size="20" font-weight="bold">5</text>
      <text x="144" y="345" text-anchor="middle" font-size="15">Both stereocenters unassigned</text>
    </g>

    <g id="aqueous-koh-route">
      <g text-anchor="middle" font-size="17">
        <text x="404" y="174">KOH (1.3 equiv) in water</text>
        <text x="404" y="200">Tetrabutylammonium bromide</text>
        <text x="404" y="221">(5 mol%)</text>
      </g>
      <g fill="none" stroke="#344e57" stroke-width="2" stroke-linejoin="round">
        <line x1="273" y1="238" x2="541" y2="238"/>
        <polyline points="625,143 541,143 541,328 625,328"/>
      </g>
      <g fill="#344e57">
        <polygon points="635,143 622,138 622,148"/>
        <polygon points="635,328 622,323 622,333"/>
      </g>
      <g text-anchor="middle" font-size="16">
        <text x="584" y="128">Loss of HI</text>
        <text x="584" y="313">Loss of HCl</text>
        <text x="404" y="271">Chloroalkenes : iodoalkenes</text>
        <text x="404" y="296" font-size="20" font-weight="bold">3 : 2</text>
      </g>
    </g>

    <g id="product-6a">
      <title>6a, (E)-chloroalkene</title>
      <g fill="none" stroke="#19262c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="665,120 701,143 665,166"/>
        <line x1="701" y1="140" x2="748" y2="140"/>
        <line x1="701" y1="146" x2="748" y2="146"/>
        <polyline points="780,122 748,143 784,166"/>
      </g>
      <g font-size="22">
        <text x="661" y="120" text-anchor="end">Cl</text>
        <text x="661" y="180" text-anchor="end">F₃C</text>
        <text x="784" y="122">H</text>
        <text x="788" y="180">CF₃</text>
      </g>
      <text x="727" y="210" text-anchor="middle" font-size="18"><tspan font-weight="bold">6a</tspan><tspan> (</tspan><tspan font-style="italic">E</tspan><tspan>)</tspan></text>
    </g>
    <text x="841" y="150" text-anchor="middle" font-size="22">+</text>

    <g id="product-6b">
      <title>6b, (Z)-chloroalkene</title>
      <g fill="none" stroke="#19262c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="885,120 921,143 885,166"/>
        <line x1="921" y1="140" x2="968" y2="140"/>
        <line x1="921" y1="146" x2="968" y2="146"/>
        <polyline points="1004,120 968,143 1000,164"/>
      </g>
      <g font-size="22">
        <text x="881" y="120" text-anchor="end">Cl</text>
        <text x="881" y="180" text-anchor="end">F₃C</text>
        <text x="1008" y="120">CF₃</text>
        <text x="1004" y="180">H</text>
      </g>
      <text x="947" y="210" text-anchor="middle" font-size="18"><tspan font-weight="bold">6b</tspan><tspan> (</tspan><tspan font-style="italic">Z</tspan><tspan>)</tspan></text>
    </g>

    <g id="chloroalkene-outcomes">
      <text x="1071" y="122" font-size="18" font-weight="bold">Chloroalkenes</text>
      <text x="1071" y="150" font-size="16">52% combined after distillation</text>
      <text x="1071" y="176" font-size="16"><tspan font-style="italic">E/Z</tspan><tspan> ≈ 4:5 by NMR</tspan></text>
    </g>

    <g id="product-7a">
      <title>7a, (E)-iodoalkene</title>
      <g fill="none" stroke="#19262c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="665,305 701,328 665,351"/>
        <line x1="701" y1="325" x2="748" y2="325"/>
        <line x1="701" y1="331" x2="748" y2="331"/>
        <polyline points="780,307 748,328 784,351"/>
      </g>
      <g font-size="22">
        <text x="661" y="305" text-anchor="end">I</text>
        <text x="661" y="365" text-anchor="end">F₃C</text>
        <text x="784" y="307">H</text>
        <text x="788" y="365">CF₃</text>
      </g>
      <text x="727" y="395" text-anchor="middle" font-size="18"><tspan font-weight="bold">7a</tspan><tspan> (</tspan><tspan font-style="italic">E</tspan><tspan>)</tspan></text>
    </g>
    <text x="841" y="335" text-anchor="middle" font-size="22">+</text>

    <g id="product-7b">
      <title>7b, (Z)-iodoalkene</title>
      <g fill="none" stroke="#19262c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="885,305 921,328 885,351"/>
        <line x1="921" y1="325" x2="968" y2="325"/>
        <line x1="921" y1="331" x2="968" y2="331"/>
        <polyline points="1004,305 968,328 1000,349"/>
      </g>
      <g font-size="22">
        <text x="881" y="305" text-anchor="end">I</text>
        <text x="881" y="365" text-anchor="end">F₃C</text>
        <text x="1008" y="305">CF₃</text>
        <text x="1004" y="365">H</text>
      </g>
      <text x="947" y="395" text-anchor="middle" font-size="18"><tspan font-weight="bold">7b</tspan><tspan> (</tspan><tspan font-style="italic">Z</tspan><tspan>)</tspan></text>
    </g>

    <g id="iodoalkene-outcomes">
      <text x="1071" y="307" font-size="18" font-weight="bold">Iodoalkenes</text>
      <text x="1071" y="335" font-size="16">34% combined after distillation</text>
      <text x="1071" y="361" font-size="16"><tspan font-style="italic">E/Z</tspan><tspan> ≈ 1:2 by NMR</tspan></text>
    </g>

    <g id="amine-base-route">
      <polyline points="144,357 144,452 622,452" fill="none" stroke="#344e57" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="635,452 622,447 622,457" fill="#344e57"/>
      <g text-anchor="middle" font-size="17">
        <text x="384" y="411">DBU or diisopropylethylamine</text>
        <text x="384" y="436">in diethyl ether or 1,2-dimethoxyethane</text>
      </g>
      <text x="653" y="449" font-size="19" font-weight="bold">6a + 6b only</text>
      <text x="653" y="475" font-size="16">The chloroalkenes were not isolated in pure form. No isolated yield was reported.</text>
    </g>
  </g>
</svg>